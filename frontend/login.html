<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Roamly</title><meta name="robots" content="noindex"><meta name="theme-color" content="#f4eee1">
<link rel="icon" href="/images/brand/favicon-32.png" type="image/png" sizes="32x32"><link rel="icon" href="/images/brand/favicon-48.png" type="image/png" sizes="48x48"><link rel="apple-touch-icon" href="/images/brand/apple-touch-icon.png">
<script src="/js/theme.js?v=3"></script>
<link rel="stylesheet" href="/css/theme.css?v=3"><link rel="stylesheet" href="/css/site.css?v=3">
</head><body data-page="login">
<a class="skip" href="#main">Skip to form</a>
<div class="auth">
 <aside class="auth-art" aria-hidden="true"><div data-art="Lisbon|city"></div><div class="stamp"><div>Est.<b>2026</b>Europe</div></div>
  <div class="cap"><span class="eyebrow">Roamly</span><h2>Pick up where you left off.</h2><p>Your saved trips, chat memory and itineraries are waiting.</p></div></aside>
 <div class="auth-main">
  <div class="top"><a class="logo" href="/" data-logo></a><button class="icon-btn" data-theme-toggle></button></div>
  <main id="main" class="auth-box">
    <h1>Welcome back</h1><p class="sub">Log in to see your trips.</p>
    <form id="form" novalidate>
     <div class="form-err" id="formErr" role="alert" hidden></div>
     <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="e-email" autofocus><div class="err" id="e-email" role="alert"></div></div>
     <div class="field"><label for="password">Password</label><div class="pwrap"><input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="e-password"><button type="button" data-toggle="password" aria-label="Show password"></button></div><div class="err" id="e-password" role="alert"></div></div>
     <div class="row-between"><label class="check"><input type="checkbox" id="remember" checked> Keep me logged in</label><a href="/forgot.html">Forgot password?</a></div>
     <button class="btn btn-primary btn-block" id="submit">Log in</button>
    </form>
    <p class="alt">New here? <a href="/signup.html">Create an account</a></p>
  </main>
  <p class="small muted" style="text-align:center">Class project &middot; <a href="/privacy.html">Privacy</a></p>
 </div>
</div>
<script src="/js/art.js?v=3"></script><script src="/js/core.js?v=3"></script><script src="/js/auth.js?v=3"></script>
</body></html>
